<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Checker</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div id="popup-content">
    <div class="header">
      <div class="title-wrapper">
        <i class="material-icons">bookmarks</i>
        <h1>書籤管理器</h1>
      </div>
      <div class="stats" id="stats-info"></div>
    </div>

    <div id="invalid-bookmarks">
      <div class="section-header">
        <div class="left-head">
          <i class="material-icons">error_outline</i>
          <h2>失效的書籤</h2>
        </div>
        <div class="bulk-actions" id="bulk-actions-container" style="display: none;">
          <label class="checkbox-container">
            <input type="checkbox" id="select-all">
            <span class="checkmark"></span>
            全選
          </label>
          <button id="bulk-delete-btn" class="text-btn danger">
            <i class="material-icons">delete_sweep</i>
            刪除選中項
          </button>
        </div>
      </div>
      <div id="invalid-list">
        <div class="loading-state">
          <p>正在初始化...</p>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="progress-container">
        <div id="progress-bar">
          <div id="progress-fill"></div>
        </div>
        <span class="progress-text">0%</span>
      </div>

      <div class="button-grid">
        <button id="check-bookmarks-btn" class="action-btn primary">
          <i class="material-icons">search</i>
          開始檢查
        </button>
        <button id="stop-check-btn" class="action-btn danger" disabled>
          <i class="material-icons">stop</i>
          停止
        </button>
        <button id="backup-btn" class="action-btn secondary">
          <i class="material-icons">backup</i>
          備份
        </button>
        <button id="cleanup-btn" class="action-btn warning">
          <i class="material-icons">auto_fix_high</i>
          自動清理
        </button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
